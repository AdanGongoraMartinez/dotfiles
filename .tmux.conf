# ==================================================
# TMUX CONFIGURATION – One Dark Pro inspired
# ==================================================

####################################################
# Prefix
####################################################
unbind C-b
set-option -g prefix `
bind-key ` send-prefix

####################################################
# Indexing
####################################################
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

####################################################
# Terminal & True Colors
####################################################
set -g default-terminal "${TERM}"
set -g terminal-overrides ",*:RGB"
set -as terminal-features "xterm-256color:RGB"

####################################################
# Gruvbox Dark Color Palette
####################################################

# Backgrounds
set -g @gb_bg "#282828"      # Fondo principal
set -g @gb_bg_alt "#3c3836"  # Fondo alternativo (línea de estado o paneles)

# Foregrounds
set -g @gb_fg "#ebdbb2"      # Texto principal (crema)
set -g @gb_fg_dim "#928374"  # Texto atenuado (gris gruvbox)

# Accents
set -g @gb_blue "#83a598"    # Azul verdoso característico
set -g @gb_green "#b8bb26"   # Verde lima seco
set -g @gb_yellow "#fabd2f"  # Amarillo vibrante
set -g @gb_red "#fb4934"     # Rojo intenso
set -g @gb_purple "#d3869b"  # Púrpura/Rosa
set -g @gb_orange "#fe8019"  # Naranja (extra típico de Gruvbox)

####################################################
# Status Bar
####################################################

# Layout:
# Left   -> Session name
# Center -> Window numbers
# Right  -> Git branch (if any)

set-option -g status-position top
set -g status-style "bg=#{@gb_bg},fg=#{@gb_fg_alt}"

# Left: session name

set -g status-left " #[fg=#{@gb_green},bold]#S "
set -g status-left-length 30

# Center: window list

set -g status-justify centre

# Right: git branch (only if inside a git repo)

set -g status-right "#[fg=#{@gb_green}]#(cd #{pane_current_path} 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null) "
set -g status-right-length 30

####################################################
# Windows
####################################################
set -g window-status-format " #[fg=#{@gb_fg_dim}]#I "
set -g window-status-current-format " #[fg=#{@gb_bg},bg=#{@gb_blue},bold]#I "

set -g window-status-bell-style "bg=#{@gb_red},fg=#{@gb_bg},bold"
set -g window-status-current-style "#{?window_zoomed_flag,bg=#{@gb_yellow},bg=#{@gb_blue}}"

####################################################
# Panes
####################################################
set -g pane-border-style "fg=#{@gb_fg_dim}"
set -g pane-active-border-style "fg=#{@gb_blue}"

# Split panes

bind '\' split-window -h
bind - split-window -v

####################################################
# Reload config
####################################################
bind r source-file ~/.tmux.conf ; display-message "tmux.conf reloaded"

####################################################
# Navigation (Vim style)
####################################################
set -g @vim_navigator_mapping_left "C-Left C-h"
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-Up C-k"
set -g @vim_navigator_mapping_down "C-Down C-j"

# Window navigation without prefix

bind -n M-n next-window
bind -n M-p previous-window

####################################################
# Copy Mode (vi)
####################################################
set-window-option -g mode-keys vi

bind-key v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

####################################################
# General Options
####################################################
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 10000

# Don't rename windows automatically

set -g allow-rename off

####################################################
# Plugins
####################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

####################################################
# TPM initialization (keep at bottom)
####################################################
run '~/.tmux/plugins/tpm/tpm'
